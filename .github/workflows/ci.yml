name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The SDK version comes from global.json.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # No packages.lock.json files, so key the NuGet cache on the central package versions and the project files.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Vocaterra.sln

      - name: Build
        run: dotnet build Vocaterra.sln -warnaserror --no-restore

      # VOCATERRA_MODELS_DIR is unset, so the model-gated tests skip; the unit, golden and fuzz suites run in full.
      - name: Test
        run: >
          dotnet test Vocaterra.sln --no-build
          --logger trx --results-directory TestResults

      # The grammar check replayed from the committed LanguageTool cache (docs/game/README.md), as the merge gate runs it: no server, and it fails
      # on an unwaived warning or a string with no cached result. grammar.yml checks the cache itself against a live LanguageTool server.
      - name: Grammar check (cached LanguageTool results)
        run: >
          scripts/content.sh grammar content/game-v1
          --strings content/grammar/game-v1-strings.jsonl --strings-only --offline --strict

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
