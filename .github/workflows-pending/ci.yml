# Parked: this file belongs at .github/workflows/ci.yml. The push token has no workflow scope, so it cannot be pushed there yet (core
# docs/DECISIONS.md D1 and the game's D-game-3, both deferred by the owner: `gh auth refresh -h github.com -s workflow`, then `git mv` it
# into place). It is the core's workflow with the repository's two halves in mind: the build-and-test job builds Vocaterra.sln (core and
# game; the game's tests run headless), and the golden, fuzz, licence, model and pack jobs point into nlp/.
name: CI

on:
  push:
    branches: [main]
    # Version tags run the pack job (the release artifacts). Tag pushes also match the push jobs' `if:`, so the other jobs run on them too.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Only the fuzz-soak job runs for these two; every other job is limited to push and pull_request by its own `if:`.
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-soak' || '' }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

  golden:
    name: golden tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Golden tests
        run: dotnet test nlp/tests/Vocaterra.Nlp.Golden.Tests --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-golden
          path: TestResults/**/*.trx
          if-no-files-found: warn

  license:
    name: license scan
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: License scan
        run: nlp/scripts/license-scan.sh

  models:
    name: model-backed tests
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && vars.VOCATERRA_RUN_MODEL_TESTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VOCATERRA_MODELS_DIR: ${{ github.workspace }}/nlp/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: nlp/models/vosk-model-small-es-0.42
          key: models-vosk-small-es-${{ hashFiles('nlp/models/manifest.json') }}

      - name: Fetch Vosk model
        run: nlp/scripts/fetch-models.sh vosk-model-small-es-0.42

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test with models
        run: dotnet test --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-models
          path: TestResults/**/*.trx
          if-no-files-found: warn

  fuzz:
    name: fuzz tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore nlp/tests/Vocaterra.Nlp.Fuzzing.Tests

      - name: Build
        run: dotnet build nlp/tests/Vocaterra.Nlp.Fuzzing.Tests --no-restore -warnaserror

      # Every oracle runs its full default depth (about a minute in all); no model files are needed.
      - name: Fuzz tests
        run: dotnet test nlp/tests/Vocaterra.Nlp.Fuzzing.Tests --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-fuzz
          path: TestResults/**/*.trx
          if-no-files-found: warn

  # Packs the libraries, builds samples/HostConsole against the packed local feed and keeps the packages as a workflow artifact. Runs on push
  # (branches and version tags) and pull request. Nothing is published to a hosted feed (nlp/docs/PACKAGING.md, D5).
  pack:
    name: pack and sample host
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: nlp/scripts/pack.sh

      - name: Sample host
        run: nlp/scripts/sample-host.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: nlp/artifacts/packages/*
          if-no-files-found: error

      # Publishing stays commented out: no hosted feed is planned (docs/PACKAGING.md, D5, decided 2026-10-21). Enabling GitHub Packages needs
      # `permissions: packages: write` on this job, and the workflow scope for this file.
      # - name: Publish to GitHub Packages
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: dotnet nuget push "nlp/artifacts/packages/*.nupkg" --source "https://nuget.pkg.github.com/james-d12/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  # The weekly (or on-demand) deep run. A failure prints the CsCheck seed; reproduce it locally with `CsCheck_Seed=<seed> dotnet test nlp/tests/Vocaterra.Nlp.Fuzzing.Tests`.
  fuzz-soak:
    name: fuzz soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VOCATERRA_FUZZ_ITERATIONS: "50000"
      VOCATERRA_FUZZ_ITERATIONS_GRAMMAR: "50000"
      VOCATERRA_FUZZ_ITERATIONS_SIGNAL: "10000"
      VOCATERRA_FUZZ_ITERATIONS_PIPELINE: "3000"
      VOCATERRA_FUZZ_ITERATIONS_CONTENT: "5000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore nlp/tests/Vocaterra.Nlp.Fuzzing.Tests

      - name: Build
        run: dotnet build nlp/tests/Vocaterra.Nlp.Fuzzing.Tests --no-restore -warnaserror

      - name: Fuzz soak
        run: dotnet test nlp/tests/Vocaterra.Nlp.Fuzzing.Tests --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-fuzz-soak
          path: TestResults/**/*.trx
          if-no-files-found: warn
